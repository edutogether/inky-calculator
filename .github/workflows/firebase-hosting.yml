# main 에 push 되면 검사(test) → 배포(deploy) 순으로 돈다.
# 배포 전에 CSP 해시 검사를 먼저 돌린다 — index.html 을 고치고 firebase.json 의 해시를
# 갱신하지 않은 채 배포하면 호스팅된 화면이 통째로 죽기 때문에, 그 경우 배포를 멈춘다.
#
# test 잡과 deploy 잡을 나눈 이유(COMMON_STANDARDS §23, 2026-09-10):
# 문서(.md·_docs/·.claude/) 한두 줄만 고쳐도 매번 배포까지 돌고 있었다. 배포는
# "사용자에게 보이는 변화가 있을 때만" 돌아야 하는데, 이 워크플로가 하나뿐이라
# 워크플로 전체에 경로 필터를 걸면 **검사(test)까지 같이 꺼진다** — tests/scenarios.test.js
# 는 문서가 아니라 index.html 만 보므로 원래 안전하지만, 다른 검사 스크립트가 문서를
# 대상으로 삼게 되는 날이 오면 그 검사까지 조용히 안 도는 사고가 난다(§21-6). 그래서
# 워크플로 트리거에는 경로 필터를 두지 않고 — test 잡은 모든 push에 항상 돈다 —
# **deploy 잡 안에서만** 문서 전용 변경을 걸러 배포를 생략한다.
name: Firebase Hosting 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

# 이 워크플로는 GITHUB_TOKEN으로 아무것도 쓰지 않는다(체크아웃만) — 최소 권한만 준다.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # v4 는 Node.js 20 위에서 도는 액션이라 러너가 24로 강제 실행하며 경고를 띄웠다.
      # v7 부터 액션 자체가 node24 를 쓴다(runs.using: node24) — 그래서 경고가 사라진다.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 검사 스크립트를 돌릴 Node. 20 은 2026-04 로 지원이 끝나 러너와 같은 24 로 맞춘다.
          node-version: '24'

      # vitest 의존성(devDependencies) 설치 — 배포 산출물이 아니라 검사용이라
      # firebase.json 의 ignore 목록에서 node_modules·package.json·tests/ 를 뺐다.
      - name: 검사 의존성 설치
        run: npm ci

      - name: CSP 해시가 index.html 과 맞는지 검사
        run: node scripts/check-csp.js

      # 첫 화면(권장안)이 협의회비 상한 비율을 지키는지 — 어기면 배포하지 않는다.
      - name: 권장안이 협의회비 상한을 지키는지 검사
        run: node scripts/check-recommended.js

      # 돈의 부호가 뒤집히지 않았는지 — 남으면 +, 넘치면 −.
      - name: 돈 부호 검사
        run: node scripts/check-signs.js

      # 캡션 글자(.cap)가 카드 배경 위에서 WCAG AA(4.5:1)를 지키는지.
      - name: 캡션 대비 검사
        run: node scripts/check-contrast.js

      # 2026-09-09에 손으로 눌러 확인한 7가지 상황(부호 양쪽·0원 경계값·집행률/게이지 색·
      # 구분 번호·자동 계산·주소 왕복)과 조작된 입력값 방어를 vitest 로 고정했다
      # (tests/scenarios.test.js). index.html 을 jsdom 에 그대로 실행시켜 render() 가
      # 그리는 화면까지 검사한다 — 문서(.md)는 이 테스트의 대상이 아니다.
      - name: 시나리오 테스트 (vitest)
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 아래 diff 가 push 범위 전체를 봐야 하므로 전체 이력을 받는다

      # 문서(.md·_docs/·.claude/)만 바뀐 커밋은 배포하지 않는다 — 사용자에게 보이는
      # 변화가 없다(§23). before 커밋을 알 수 없으면(첫 push 등) 안전하게 배포 쪽으로 둔다.
      - name: 배포가 필요한 변경인지 확인
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "사유: workflow_dispatch 수동 실행 — 항상 배포한다"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "사유: 이전 커밋을 알 수 없음(새 브랜치의 첫 push 등) — 안전하게 배포한다"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "바뀐 파일 목록 (${before}..${{ github.sha }}):"
          git diff --name-only "$before" "${{ github.sha }}" | tee /tmp/changed.txt
          if grep -vE '(\.md$|^_docs/|^\.claude/)' /tmp/changed.txt | grep -q .; then
            echo "사유: 문서 이외의 파일이 바뀜 — 배포한다"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "사유: 문서만 바뀜 — 배포를 생략한다"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Firebase Hosting 에 배포
        if: steps.changed.outputs.deploy == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_INKY_CALCULATOR }}
          projectId: inky-calculator
          channelId: live

      # 이번 이전의 목적이 응답 헤더라, 헤더가 빠진 배포는 성공이 아니다.
      # 두 주소를 다 본다: 사람들이 쓰는 것은 공식 주소이고, Firebase 기본 주소와 결과가
      # 갈리면 그건 커스텀 도메인 쪽 설정만 틀어졌다는 뜻이라 그 자체가 잡아야 할 신호다.
      - name: 보안 헤더 확인 — 공식 주소
        if: steps.changed.outputs.deploy == 'true'
        run: node scripts/check-headers.js https://calc.edutogether.kr/

      - name: 보안 헤더 확인 — Firebase 기본 주소
        if: steps.changed.outputs.deploy == 'true'
        run: node scripts/check-headers.js https://inky-calculator.web.app/
