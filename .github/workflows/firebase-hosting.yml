# main 에 push 되면 Firebase Hosting(프로젝트 inky-calculator)에 배포한다.
# 배포 전에 CSP 해시 검사를 먼저 돌린다 — index.html 을 고치고 firebase.json 의 해시를
# 갱신하지 않은 채 배포하면 호스팅된 화면이 통째로 죽기 때문에, 그 경우 배포를 멈춘다.
name: Firebase Hosting 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: CSP 해시가 index.html 과 맞는지 검사
        run: node scripts/check-csp.js

      # 첫 화면(권장안)이 협의회비 상한 비율을 지키는지 — 어기면 배포하지 않는다.
      - name: 권장안이 협의회비 상한을 지키는지 검사
        run: node scripts/check-recommended.js

      # 돈의 부호가 뒤집히지 않았는지 — 남으면 +, 넘치면 −.
      - name: 돈 부호 검사
        run: node scripts/check-signs.js

      - name: Firebase Hosting 에 배포
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_INKY_CALCULATOR }}
          projectId: inky-calculator
          channelId: live

      # 이번 이전의 목적이 응답 헤더라, 헤더가 빠진 배포는 성공이 아니다.
      # 두 주소를 다 본다: 사람들이 쓰는 것은 공식 주소이고, Firebase 기본 주소와 결과가
      # 갈리면 그건 커스텀 도메인 쪽 설정만 틀어졌다는 뜻이라 그 자체가 잡아야 할 신호다.
      - name: 보안 헤더 확인 — 공식 주소
        run: node scripts/check-headers.js https://calc.edutogether.kr/

      - name: 보안 헤더 확인 — Firebase 기본 주소
        run: node scripts/check-headers.js https://inky-calculator.web.app/
